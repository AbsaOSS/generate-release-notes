[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/**"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"release_notes_generator/utils/constants.py" = ["S105"]


[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
exclude = "tests"

[tool.pytest.ini_options]
pythonpath = ["."]
