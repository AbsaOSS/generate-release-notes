name: Release - create draft release
on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Name of git tag to be created, and then draft release created. Syntax: "v[0-9]+.[0-9]+.[0-9]+", optionally with a pre-release suffix such as "-RC1".'
        required: true
      from-tag-name:
        description: 'Name of the git tag from which to detect changes from. Default value: latest non-pre-release tag. Syntax: "v[0-9]+.[0-9]+.[0-9]+", optionally with a pre-release suffix such as "-RC1".'
        required: false

jobs:
  release-draft:
    runs-on: {your-runner}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false

      # generate-release-notes requires Python 3.11 or newer
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11'

      # version-tag-check v1.0.0 accepts the SemVer pre-release form "vX.Y.Z-RCn", not the PEP 440 form "vX.Y.ZrcN"
      - name: Check format of received tag
        id: check-version-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.tag-name }}

      - name: Check format of received from tag
        if: ${{ github.event.inputs.from-tag-name }}
        id: check-version-from-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.from-tag-name }}
          should-exist: true

      - name: Generate Release Notes
        id: generate_release_notes
        uses: AbsaOSS/generate-release-notes@v1.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: ${{ github.event.inputs.tag-name }}
          chapters: |
            - { title: No entry 🚫, label: duplicate, order: 10 }
            - { title: Breaking Changes 💥, label: breaking-change, order: 20 }
            - { title: New Features 🎉, label: enhancement, order: 30 }
            - { title: New Features 🎉, label: feature }
            - { title: Bugfixes 🛠, label: bug, order: 40 }
            - { title: Infrastructure ⚙️, label: infrastructure, order: 50 }
            - { title: Silent-live 🤫, label: silent-live, order: 60 }
            - { title: Documentation 📜, label: documentation, order: 70 }

          skip-release-notes-labels: 'no RN'
          verbose: true

          warnings: true
          print-empty-chapters: true

      - name: Create and Push Tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const tag = core.getInput('tag-name')
            const ref = `refs/tags/${tag}`;
            const sha = context.sha; // The SHA of the commit to tag

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              sha: sha
            });

            console.log(`Tag created: ${tag}`);
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-name: ${{ github.event.inputs.tag-name }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.event.inputs.tag-name }}
          body: ${{ steps.generate_release_notes.outputs.release-notes }}
          tag_name: ${{ github.event.inputs.tag-name }}
          draft: true
          prerelease: ${{ steps.generate_release_notes.outputs.prerelease }}
